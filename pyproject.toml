[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifesim"
version = "0.1.0"
description = "Small artificial-life simulator and PyTorch learning laboratory"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["agents*", "analysis*", "learning*", "persistence*", "simulation*", "web*", "world*"]
